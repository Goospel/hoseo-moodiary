# Moodiary 기본 설정.
#
# 규칙
# - 이 파일은 git에 커밋된다 (PR 2-c 사고 이후 — application.yaml 이 .gitignore 되어 있어
#   jwt 설정이 운영에 누락되는 일이 있었음).
# - 비밀값은 절대 하드코딩 X. ${ENV_VAR:기본값} 형식으로 적는다.
#   기본값은 "로컬 dev 환경에서 안전하게 동작"하는 수준만 적는다. 운영은 env var 로 override.
# - 개인 환경 차이는 application-local.yaml 에 적는다 (gitignored, Spring 이 자동 merge).
#
# 운영에서 env var 로 주입되는 항목
# - SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD (RDS)
# - JWT_SECRET (Base64 32바이트 이상 랜덤. 누락 시 아래 기본값이 들어가 보안 사고)
# - JWT_ACCESS_EXPIRATION_MS (선택 — 미지정 시 기본 1시간)
# - JWT_REFRESH_EXPIRATION_MS (선택 — 미지정 시 기본 2주)
#
# ddl-auto 기본값 = update (스키마 미확정 단계 정책)
# - 엔티티에 새 필드/테이블이 추가되면 Hibernate 가 운영 RDS 에 컬럼/테이블을 추가해줌.
# - update 는 컬럼 추가만 함. 삭제/타입변경은 안 함. 그래서 데이터 소실 위험은 없음.
# - 단, 인덱스/제약은 보장 안 됨 → 성능/무결성에 민감한 경우는 수동 DDL 필요.
# - 스키마가 안정화되면 SPRING_JPA_HIBERNATE_DDL_AUTO=validate 로 잠가야 함 (Flyway 도입 시점).

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3309/moodiary}
    username: ${SPRING_DATASOURCE_USERNAME:dev}
    password: ${SPRING_DATASOURCE_PASSWORD:dev123}
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# JWT 설정 (PR 10 — Refresh Token 도입)
# - secret: HS256 서명 키. 최소 32바이트 (Base64로 약 44자) 이상이어야 jjwt가 거부하지 않는다.
#           기본값은 dev 전용 — 운영에는 반드시 JWT_SECRET env var 로 override.
# - access-token-expiration-ms: access token 수명. 기본 1시간(3,600,000ms). 만료 시 /auth/refresh 로 갱신.
# - refresh-token-expiration-ms: refresh token 수명. 기본 2주(1,209,600,000ms). 만료 시 재로그인.
jwt:
  secret: ${JWT_SECRET:dev-local-secret-CHANGE-ME-in-production-min-32-bytes-required!}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000}

# CORS 설정 (PR 8 — 프론트 S3 통합)
# - allowed-origins: 콤마 구분된 origin 목록. CorsConfig 가 split 해서 사용.
# - 기본값은 로컬 dev (CRA 3000, Vite 5173, Next 3000). 운영은 EC2 .env 의 APP_CORS_ALLOWED_ORIGINS 로 override 해서 S3 endpoint URL 추가.
# - 와일드카드(*) 금지 — CorsConfig 의 allowCredentials=true 와 충돌. 정확한 URL 만.
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
