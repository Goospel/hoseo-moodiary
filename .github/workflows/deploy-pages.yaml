# GitHub Pages 자동 배포.
#
# 결과 URL: https://goospel.github.io/hoseo-moodiary/
#   - /                  → site/index.html (landing page)
#   - /slides/           → presentation/moodiary-be-presentation.md 를 Marp HTML 로 변환
#   - /learning-notes/   → claude-docs/learning-notes.md 를 pandoc HTML 로 변환
#
# 트리거:
#   - dev push 시 site/** / presentation/** / claude-docs/learning-notes.md 변경된 경우만
#     (학습 노트가 main 머지 전에도 사이트에 반영되도록 의도적으로 dev 트리거.
#      site/slides 도 dev 에서 빌드 — dev 는 main 의 superset 이라 안전.)
#   - 또는 GitHub UI 에서 수동 실행 (workflow_dispatch)
#
# 사전 셋업 (한 번만):
#   Repo Settings → Pages → Source = "GitHub Actions"
#
# 작동 방식:
#   modern 방식 (gh-pages branch 안 만듦). actions/upload-pages-artifact + deploy-pages.

name: Deploy GitHub Pages (landing + slides + learning-notes)

on:
  push:
    branches: [dev]
    paths:
      - 'site/**'
      - 'presentation/**'
      - 'claude-docs/learning-notes.md'
      - '.github/workflows/deploy-pages.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 배포는 동시에 하나만. 새 deploy 시작되면 이전 건 중단되지 않고 끝까지 완주.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site (landing + Marp slides + learning-notes)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli@latest

      - name: Install pandoc (for learning-notes.md → HTML)
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build site
        run: |
          set -euo pipefail

          # 1) landing page (site/) 를 _site/ 루트로 복사
          #    단 pandoc template 파일은 deploy artifact 에서 제외 (HTML 이지만 페이지가 아님)
          mkdir -p _site
          cp -r site/* _site/
          rm -f _site/learning-notes-template.html

          # 2) Marp 슬라이드 → _site/slides/index.html
          mkdir -p _site/slides
          marp presentation/moodiary-be-presentation.md \
            --html \
            --allow-local-files \
            -o _site/slides/index.html

          # 3) PDF 도 다운로드용으로 — chromium 필요. 실패해도 전체 빌드 fail 안 하게.
          marp presentation/moodiary-be-presentation.md \
            --pdf \
            --allow-local-files \
            -o _site/slides/moodiary-be-presentation.pdf \
          || echo "::warning::PDF build failed (chromium issue?). HTML 만 deploy 됨."

          # 4) 학습 노트 (claude-docs/learning-notes.md) → _site/learning-notes/index.html
          mkdir -p _site/learning-notes
          pandoc claude-docs/learning-notes.md \
            --from=gfm+pipe_tables+task_lists+autolink_bare_uris \
            --to=html5 \
            --standalone \
            --metadata title="Moodiary BE — 학습 노트" \
            --metadata lang=ko \
            --template=site/learning-notes-template.html \
            --toc \
            --toc-depth=2 \
            -o _site/learning-notes/index.html

          echo "::group::Built site tree"
          find _site -maxdepth 3 -type f | head -40
          echo "::endgroup::"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
