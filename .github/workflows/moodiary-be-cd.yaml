name: CD - Build and Push Docker Image

on:
  push:
    branches: [main]

jobs:
  springboot-moodiary-backend-cd:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-test-reports
          path: build/reports/tests/test/

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/hoseo-moodiary-linux:latest .

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/hoseo-moodiary-linux:latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/hoseo-moodiary-linux:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: springboot-moodiary-backend-cd
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 배포는 EC2 의 docker compose 로 통일.
      # - repo 의 compose.yaml 을 EC2 로 가져옴 (단일 진실의 원천)
      # - 시크릿은 EC2 의 /home/ec2-user/.env 에서 주입 (워크플로우는 시크릿 모름)
      # - pull_policy:always + restart:unless-stopped 이라 재부팅 시 자동 기동
      - name: Deploy to EC2 via SSM (docker compose)
        run: |
          aws ssm send-command \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy hoseo-moodiary via docker compose" \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --parameters 'commands=[
            "cd /home/ec2-user",
            "curl -sfL https://raw.githubusercontent.com/Goospel/hoseo-moodiary/main/compose.yaml -o compose.yaml",
            "docker compose pull",
            "docker compose up -d"
          ]' \
          --region "${{ secrets.AWS_REGION }}" \
          --output text