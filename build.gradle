plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'hoseo'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// MoodiaryApplicationTests (full ApplicationContext 부팅 안전망) 의 DataSource 대체.
	// 운영은 MySQL/RDS, 테스트는 H2 in-memory — MySQL 모드로 띄워 SQL 방언 차이 최소화.
	testRuntimeOnly 'com.h2database:h2'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// Swagger (SpringDoc OpenAPI)
	// - 3.0.x = Spring Boot 4.x 호환 라인. 2.x 는 Spring Boot 3.x 전용으로 굳었다.
	// - 2.8.3 으로 부팅 시 `QuerydslPredicateOperationCustomizer` → `TypeInformation` 클래스 위치 변경 비호환
	//   으로 `NoClassDefFoundError` 가 떨어진다 (단위 테스트는 통과, 운영 부팅에서만 폭발).
	//   재현 안전망: `MoodiaryApplicationTests.contextLoads()`.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

	// JWT (jjwt) — io.jsonwebtoken
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// QueryDSL
	// - 이전에는 compileOnly 였음 (역사적 사유: springdoc / Spring Data 4.x 호환성 우려).
	//   하지만 QueryDSL을 실제로 사용하는 첫 PR(#PR5 캘린더)에서 NoClassDefFoundError 가 터졌다 —
	//   compileOnly 면 운영 jar 와 test runtime 에 querydsl-jpa 클래스가 빠져버린다.
	// - implementation 으로 전환: 컴파일 + 런타임 + 테스트 클래스패스 모두 포함.
	// - 부팅/Swagger 검증은 PR 5 빌드 단계와 운영 배포 시점에서 한다.
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.jar {
	enabled = false
}

clean {
	delete file('src/main/generated')
}
